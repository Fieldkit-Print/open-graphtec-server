<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Graphtec Server</title>
<style>
  :root {
    color-scheme: light;
    --plane: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --hairline: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --plane: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --hairline: #2c2c2a;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #3987e5;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--plane);
    color: var(--ink);
    padding: 24px;
    max-width: 1080px;
    margin: 0 auto;
  }
  header {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .wordmark { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .wordmark span { color: var(--accent); }
  .conn { margin-left: auto; font-size: 13px; color: var(--ink-2);
          display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block;
         flex: none; }
  .tiles {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    margin-bottom: 16px;
  }
  .tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
  }
  .tile .label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
  }
  .tile .value { font-size: 19px; font-weight: 650; line-height: 1.25; }
  .tile .sub { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
  .tile .sub.err { color: var(--critical); }
  .status-line { display: flex; align-items: center; gap: 8px; }
  section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 16px;
  }
  h2 {
    font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th {
    text-align: left; font-weight: 600; color: var(--muted);
    font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 6px 10px 6px 0; border-bottom: 1px solid var(--hairline);
  }
  td {
    padding: 7px 10px 7px 0; border-bottom: 1px solid var(--hairline);
    color: var(--ink);
  }
  td.num, td.mono { font-variant-numeric: tabular-nums; }
  td.mono { color: var(--ink-2); }
  tr:last-child td { border-bottom: none; }
  .events { list-style: none; font-size: 13.5px; }
  .events li {
    display: flex; gap: 10px; padding: 6px 0;
    border-bottom: 1px solid var(--hairline); align-items: baseline;
  }
  .events li:last-child { border-bottom: none; }
  .evt-time { flex: 0 0 62px; font-size: 12.5px;
              font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .evt-kind {
    flex: 0 0 72px; font-size: 11px; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted);
  }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
  .del {
    font-size: 12px; background: none; border: 1px solid var(--border);
    color: var(--ink-2); padding: 3px 10px; border-radius: 6px; cursor: pointer;
  }
  .del:hover { border-color: var(--critical); color: var(--critical); }
  .keyrow { display: none; gap: 8px; margin-top: 8px; }
  .keyrow input {
    flex: 1; padding: 6px 10px; font-size: 13px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--plane); color: var(--ink);
  }
  .keyrow button {
    padding: 6px 14px; font-size: 13px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  }
  footer { font-size: 12px; color: var(--muted); text-align: center; padding: 8px; }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
</style>
</head>
<body>
<header>
  <div class="wordmark">Open <span>Graphtec</span> Server</div>
  <div class="conn"><span class="dot" id="conn-dot" style="background:var(--muted)"></span><span id="conn-text">connecting…</span></div>
</header>

<div class="tiles" id="tiles"></div>

<section>
  <h2>Recent activity</h2>
  <ul class="events" id="events"><li class="empty">No events yet.</li></ul>
</section>

<section>
  <h2>Cut jobs</h2>
  <div id="jobs-wrap"><div class="empty">Loading…</div></div>
  <div class="keyrow" id="keyrow">
    <input id="key-input" type="password" placeholder="API key required" aria-label="API key">
    <button id="key-save">Save</button>
  </div>
</section>

<footer>Open Graphtec Server · <span id="foot-note">—</span></footer>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[<>&"]/g, "");

// Status color + label pairs (color never carries meaning alone).
const DLS_COLORS = {
  "-999": "var(--critical)", "0": "var(--muted)", "1": "var(--accent)",
  "2": "var(--accent)", "3": "var(--accent)", "4": "var(--accent)",
  "5": "var(--good)", "6": "var(--warning)", "7": "var(--critical)",
};

function fmtTime(iso) {
  try { return new Date(iso).toLocaleTimeString([], {hour12: false}); }
  catch { return iso; }
}

function cutterTile(c) {
  const color = c.is_running
    ? (DLS_COLORS[String(c.current_status)] || "var(--muted)")
    : "var(--muted)";
  const state = c.is_running
    ? (c.current_status_label || c.current_status) : "Worker stopped";
  const sub = c.last_error
    ? `<div class="sub err">⚠ ${esc(c.last_error)}</div>`
    : `<div class="sub">${c.standby_mode
        ? "Standby — waiting for a scan cycle" : "Active in scan cycle"}</div>`;
  return `<div class="tile">
    <div class="label">Cutter · ${esc(c.cutter_name)}</div>
    <div class="value">${esc(c.cutter_model || "Not identified")}</div>
    <div class="sub">${esc(c.cutter_host)}:${esc(c.cutter_port)}` +
    (c.cutter_step_size_mm ? ` · step ${esc(c.cutter_step_size_mm)} mm` : "") +
    `</div>
    <div class="sub status-line" style="margin-top:8px">
      <span class="dot" style="background:${color}"></span>
      <span>${esc(state)}</span>
    </div>
    ${sub}
  </div>`;
}

async function pollHealth() {
  let data;
  try {
    data = await (await fetch("/health", {cache: "no-store"})).json();
  } catch {
    $("conn-dot").style.background = "var(--critical)";
    $("conn-text").textContent = "server unreachable";
    return;
  }
  $("conn-dot").style.background = "var(--good)";
  $("conn-text").textContent = "server online";

  const cutters = data.cutters || [];
  const ing = data.ingest || {};
  $("tiles").innerHTML =
    cutters.map(cutterTile).join("") +
    `<div class="tile">
      <div class="label">Hot Folder</div>
      <div class="value status-line">
        <span class="dot" style="background:${ing.is_running ? "var(--good)" : "var(--muted)"}"></span>
        <span>${ing.is_running ? "Watching" : "Stopped"}</span>
      </div>
      <div class="sub">${ing.processed_count ?? 0} processed · ${ing.error_count ?? 0} errors</div>
      ${ing.last_processed_file ? `<div class="sub">last: ${esc(ing.last_processed_file)}</div>` : ""}
    </div>`;

  const showCutterTag = cutters.length > 1;
  const events = cutters
    .flatMap((c) => (c.recent_events || []).map(
      (e) => ({...e, cutter: c.cutter_name})))
    .sort((a, b) => a.time < b.time ? 1 : -1)
    .slice(0, 12);
  $("events").innerHTML = events.length
    ? events.map((e) => `<li>
        <span class="evt-time">${fmtTime(e.time)}</span>
        <span class="evt-kind">${showCutterTag ? esc(e.cutter) : esc(e.kind)}</span>
        <span>${esc(e.message)}</span></li>`).join("")
    : '<li class="empty">No events yet.</li>';
}

function authHeaders() {
  const key = localStorage.getItem("ogs_api_key");
  return key ? {"X-API-Key": key} : {};
}

async function pollJobs() {
  let res;
  try {
    res = await fetch("/jobs?limit=15", {headers: authHeaders(), cache: "no-store"});
  } catch { return; }
  if (res.status === 401) {
    $("jobs-wrap").innerHTML =
      '<div class="empty">An API key is configured on this server.</div>';
    $("keyrow").style.display = "flex";
    return;
  }
  $("keyrow").style.display = "none";
  const jobs = await res.json();
  if (!jobs.length) {
    $("jobs-wrap").innerHTML = '<div class="empty">No jobs loaded.</div>';
    return;
  }
  const rows = jobs.map((j) => `<tr>
    <td class="num">${j.id}</td>
    <td>${esc(j.name)}</td>
    <td class="mono">${esc(j.barcode_link_info)}</td>
    <td>${j.command_type === 0 ? "GP-GL" : "HP-GL"}</td>
    <td class="num">${(j.command_length / 1024).toFixed(1)} KB</td>
    <td class="mono">${new Date(j.created_at).toLocaleString([], {hour12: false})}</td>
    <td><button class="del" data-id="${j.id}" data-name="${esc(j.name)}">Delete</button></td>
  </tr>`).join("");
  $("jobs-wrap").innerHTML = `<table>
    <thead><tr><th>ID</th><th>Name</th><th>Barcode</th><th>Type</th>
    <th>Size</th><th>Created</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

document.addEventListener("click", async (evt) => {
  const btn = evt.target.closest(".del");
  if (!btn) return;
  if (!confirm(`Delete job "${btn.dataset.name}"? Cutters will no longer be offered it.`)) return;
  const res = await fetch(`/jobs/${btn.dataset.id}`, {
    method: "DELETE", headers: authHeaders(),
  });
  if (res.status === 401) $("keyrow").style.display = "flex";
  pollJobs();
});

$("key-save").addEventListener("click", () => {
  localStorage.setItem("ogs_api_key", $("key-input").value.trim());
  pollJobs();
});

fetch("/version").then((r) => r.json()).then((v) => {
  $("foot-note").textContent = `v${v.version} · ${window.location.host}`;
}).catch(() => { $("foot-note").textContent = window.location.host; });

pollHealth(); pollJobs();
setInterval(pollHealth, 2000);
setInterval(pollJobs, 5000);
</script>
</body>
</html>
