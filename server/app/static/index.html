<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Graphtec Server</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f7f5f0;
    --ink: #191713;
    --ink-2: #6b675e;
    --hairline: #ddd8cc;
    --accent: #2456b8;
    --good: #0a7d0a;
    --warn: #9a6b00;
    --crit: #c22f2f;
    --mark: #191713;          /* registration-mark ink */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #111315;
      --ink: #f2f0ea;
      --ink-2: #a19d92;
      --hairline: #2b2f34;
      --accent: #7ba4f5;
      --good: #3fae3f;
      --warn: #d9a13b;
      --crit: #e05252;
      --mark: #f2f0ea;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 24px 40px;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .micro {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-2);
  }

  /* ---- header strip ---- */
  header {
    display: flex; align-items: center; gap: 14px;
    padding-bottom: 14px; border-bottom: 1px solid var(--ink);
    flex-wrap: wrap;
  }
  .lockup {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 15px; font-weight: 700; letter-spacing: 0.08em;
  }
  .lockup em { font-style: normal; color: var(--accent); }
  .machine { margin-left: auto; text-align: right; }
  .machine .model { font-weight: 600; font-size: 13px; }
  .heartbeat {
    display: inline-block; width: 8px; height: 8px; margin-right: 6px;
    background: var(--ink-2); vertical-align: baseline;
  }
  .heartbeat.ok { background: var(--good); }
  .heartbeat.bad { background: var(--crit); }
  @media (prefers-reduced-motion: no-preference) {
    .heartbeat.pulse { animation: pulse 0.4s ease-out; }
    @keyframes pulse { from { transform: scale(1.7); } to { transform: scale(1); } }
  }

  /* ---- state board, framed by registration marks ---- */
  .board {
    position: relative;
    margin: 30px 8px 26px;
    padding: 34px 40px 30px;
  }
  .rm { position: absolute; width: 20px; height: 20px; }
  .rm::before, .rm::after { content: ""; position: absolute; background: var(--mark); }
  .rm::before { width: 100%; height: 2px; }
  .rm::after  { width: 2px; height: 100%; }
  .rm.tl { top: 0; left: 0; }
  .rm.tr { top: 0; right: 0; }   .rm.tr::before { right: 0; } .rm.tr::after { right: 0; }
  .rm.bl { bottom: 0; left: 0; } .rm.bl::before { bottom: 0; }
  .rm.br { bottom: 0; right: 0; }
  .rm.br::before { bottom: 0; right: 0; } .rm.br::after { right: 0; }

  .state-word {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(34px, 7vw, 56px);
    font-weight: 700; letter-spacing: 0.06em; line-height: 1.05;
  }
  .state-word.good { color: var(--good); }
  .state-word.warn { color: var(--warn); }
  .state-word.crit { color: var(--crit); }
  .state-sub { color: var(--ink-2); margin-top: 6px; font-size: 13.5px; }
  .state-sub strong { color: var(--crit); font-weight: 600; }

  .track {
    display: flex; gap: 0; margin-top: 24px;
    border-top: 1px solid var(--hairline); padding-top: 12px;
    flex-wrap: wrap; row-gap: 8px;
  }
  .seg {
    flex: 1 1 90px; display: flex; align-items: center; gap: 7px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10.5px; letter-spacing: 0.12em; color: var(--ink-2);
  }
  .seg::before {
    content: ""; width: 9px; height: 9px;
    border: 1.5px solid var(--ink-2); background: transparent;
  }
  .seg.on { color: var(--ink); font-weight: 700; }
  .seg.on::before { background: var(--ink); border-color: var(--ink); }

  /* ---- two columns: activity + nameplate ---- */
  .cols { display: grid; grid-template-columns: 1fr 300px; gap: 28px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  h2 {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-2); font-weight: 600;
    border-bottom: 1px solid var(--ink); padding-bottom: 6px; margin-bottom: 4px;
  }
  .log { list-style: none; }
  .log li {
    display: flex; gap: 12px; align-items: baseline;
    padding: 5.5px 0; border-bottom: 1px solid var(--hairline);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12.5px;
  }
  .log .t { color: var(--ink-2); flex: 0 0 60px; }
  .log .k { flex: 0 0 66px; letter-spacing: 0.08em; text-transform: uppercase;
            font-size: 10px; color: var(--ink-2); padding-top: 2px; }
  .log .empty, .jobs-empty { color: var(--ink-2); font-size: 13px; padding: 8px 0;
    font-family: system-ui, sans-serif; }

  .plate { border: 1px solid var(--ink); padding: 4px 14px 10px; align-self: start; }
  .plate h2 { border-bottom: 1px solid var(--hairline); margin: 8px -14px 2px;
              padding: 0 14px 6px; }
  .plate dl { display: grid; grid-template-columns: auto 1fr; column-gap: 14px; }
  .plate dt {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-2); padding: 6px 0; align-self: baseline;
  }
  .plate dd {
    text-align: right; font-size: 13px; padding: 5px 0;
    font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
  }
  .plate dd .st { font-weight: 600; }
  .plate dd .st.good { color: var(--good); }
  .plate dd .st.crit { color: var(--crit); }

  /* ---- jobs ---- */
  .jobs { margin-top: 30px; }
  table { width: 100%; border-collapse: collapse; }
  th {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-2); font-weight: 600; text-align: left;
    padding: 8px 12px 6px 0; border-bottom: 1px solid var(--ink);
  }
  td {
    padding: 9px 12px 9px 0; border-bottom: 1px solid var(--hairline);
    font-size: 13px; vertical-align: middle;
  }
  td.num, td.mono-cell, .mono-cell {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; font-size: 12.5px;
  }
  .code39 { display: inline-flex; align-items: center; gap: 10px; }
  .bars { display: inline-flex; height: 18px; }
  .bars i { display: inline-block; height: 100%; }
  .bars i.b { background: var(--ink); }
  .del {
    font-family: ui-monospace, monospace; font-size: 11px;
    background: none; border: 1px solid var(--hairline); color: var(--ink-2);
    padding: 2px 8px; cursor: pointer; letter-spacing: 0.06em;
  }
  .del:hover { border-color: var(--crit); color: var(--crit); }
  .keyrow { display: none; gap: 8px; margin-top: 10px; }
  .keyrow input {
    flex: 1; padding: 6px 10px; font-size: 13px;
    border: 1px solid var(--hairline); background: var(--paper); color: var(--ink);
    font-family: ui-monospace, monospace;
  }
  .keyrow button {
    padding: 6px 14px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    font-family: ui-monospace, monospace; letter-spacing: 0.08em;
  }
  footer {
    margin-top: 36px; padding-top: 10px; border-top: 1px solid var(--hairline);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px;
  }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>
</head>
<body>
<header>
  <div class="lockup">OPEN <em>GRAPHTEC</em> SERVER</div>
  <div class="machine">
    <div class="model mono" id="machine-model">—</div>
    <div class="micro"><span class="heartbeat" id="hb"></span><span id="link-text">connecting</span></div>
  </div>
</header>

<div class="board">
  <span class="rm tl"></span><span class="rm tr"></span>
  <span class="rm bl"></span><span class="rm br"></span>
  <div class="state-word" id="state-word">—</div>
  <div class="state-sub" id="state-sub">Waiting for first status report.</div>
  <div class="track" id="track"></div>
</div>

<div class="cols">
  <section>
    <h2>Activity</h2>
    <ul class="log" id="log"><li class="empty">Nothing yet — events appear as the cutter works.</li></ul>
  </section>
  <aside class="plate">
    <h2>Nameplate</h2>
    <dl id="plate"></dl>
  </aside>
</div>

<section class="jobs">
  <h2>Job library</h2>
  <div id="jobs-wrap"><div class="jobs-empty">Loading…</div></div>
  <div class="keyrow" id="keyrow">
    <input id="key-input" type="password" placeholder="API key" aria-label="API key">
    <button id="key-save">UNLOCK</button>
  </div>
</section>

<footer class="micro">
  <span id="foot-id">open graphtec server</span>
  <span id="foot-host"></span>
</footer>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[<>&"]/g, "");

/* The Data Link cycle, in machine order. 6/7/-999 override the word. */
const CYCLE = [
  [0, "IDLE"], [1, "SCAN"], [2, "MATCH"], [3, "SELECT"], [4, "SEND"], [5, "CUT"],
];
const STATE_WORDS = {
  "-999": ["NO LINK", "crit"], "0": ["IDLE", ""], "1": ["SCANNING", ""],
  "2": ["MATCHING", ""], "3": ["SELECTING", ""], "4": ["SENDING", ""],
  "5": ["CUTTING", "good"], "6": ["OPERATOR", "warn"], "7": ["ERROR", "crit"],
};

/* CODE39 patterns — the bars in the job table are the real scan data. */
const C39 = {
  "0":"nnnwwnwnn","1":"wnnwnnnnw","2":"nnwwnnnnw","3":"wnwwnnnnn","4":"nnnwwnnnw",
  "5":"wnnwwnnnn","6":"nnwwwnnnn","7":"nnnwnnwnw","8":"wnnwnnwnn","9":"nnwwnnwnn",
  "A":"wnnnnwnnw","B":"nnwnnwnnw","C":"wnwnnwnnn","D":"nnnnwwnnw","E":"wnnnwwnnn",
  "F":"nnwnwwnnn","G":"nnnnnwwnw","H":"wnnnnwwnn","I":"nnwnnwwnn","J":"nnnnwwwnn",
  "K":"wnnnnnnww","L":"nnwnnnnww","M":"wnwnnnnwn","N":"nnnnwnnww","O":"wnnnwnnwn",
  "P":"nnwnwnnwn","Q":"nnnnnnwww","R":"wnnnnnwwn","S":"nnwnnnwwn","T":"nnnnwnwwn",
  "U":"wwnnnnnnw","V":"nwwnnnnnw","W":"wwwnnnnnn","X":"nwnnwnnnw","Y":"wwnnwnnnn",
  "Z":"nwwnwnnnn","*":"nwnnwnwnn",
};
function barcodeHTML(text) {
  let html = "";
  for (const [i, ch] of [...("*" + text + "*")].entries()) {
    if (i) html += '<i style="width:1px"></i>';
    const pattern = C39[ch] || C39["*"];
    for (let p = 0; p < 9; p++) {
      const w = pattern[p] === "w" ? "2.5px" : "1px";
      html += `<i class="${p % 2 ? "" : "b"}" style="width:${w}"></i>`;
    }
  }
  return `<span class="code39"><span class="bars" aria-hidden="true">${html}</span><span class="mono-cell">${esc(text)}</span></span>`;
}

function fmtT(iso) {
  try { return new Date(iso).toLocaleTimeString([], {hour12: false}); }
  catch { return iso; }
}

function renderTrack(code, running) {
  $("track").innerHTML = CYCLE.map(([value, label]) =>
    `<span class="seg${running && value === code ? " on" : ""}">${label}</span>`
  ).join("");
}

async function pollHealth() {
  const hb = $("hb");
  let data;
  try {
    data = await (await fetch("/health", {cache: "no-store"})).json();
  } catch {
    hb.className = "heartbeat bad";
    $("link-text").textContent = "server unreachable";
    $("state-word").textContent = "OFFLINE";
    $("state-word").className = "state-word crit";
    $("state-sub").textContent = "The server is not answering. Check that it is running.";
    renderTrack(-1, false);
    return;
  }
  hb.className = "heartbeat ok pulse";
  setTimeout(() => hb.classList.remove("pulse"), 450);
  $("link-text").textContent = "server online";

  const dls = data.dls || {}, ing = data.ingest || {};
  $("machine-model").textContent = dls.cutter_model || "cutter not identified";

  const code = dls.current_status;
  let word, tone, sub;
  if (!dls.is_running) {
    word = "OFFLINE"; tone = "";
    sub = "Data Link is switched off. Start it to serve barcode scans.";
  } else {
    [word, tone] = STATE_WORDS[String(code)] || [`STATE ${code}`, ""];
    if (dls.last_error) sub = "";
    else if (code === 0 && dls.standby_mode)
      sub = "Cutter idle. The next barcode scan starts a cycle.";
    else if (code === 0) sub = "Cutter idle.";
    else if (code === 5) sub = "Blade down — job in progress.";
    else if (code === 6) sub = "Waiting for the operator at the cutter panel.";
    else sub = "Data Link cycle in progress.";
  }
  $("state-word").textContent = word;
  $("state-word").className = "state-word " + tone;
  $("state-sub").innerHTML = dls.last_error
    ? `<strong>&#9888; ${esc(dls.last_error)}</strong>` : esc(sub);
  renderTrack(code, dls.is_running);

  const events = (dls.recent_events || []).slice().reverse().slice(0, 14);
  $("log").innerHTML = events.length
    ? events.map((e) =>
        `<li><span class="t">${fmtT(e.time)}</span><span class="k">${esc(e.kind)}</span><span>${esc(e.message)}</span></li>`
      ).join("")
    : '<li class="empty">Nothing yet — events appear as the cutter works.</li>';

  const stat = (ok, yes, no) =>
    `<span class="st ${ok ? "good" : "crit"}">${ok ? yes : no}</span>`;
  $("plate").innerHTML = `
    <dt>Cutter</dt><dd class="mono-cell">${esc(dls.cutter_host)}:${esc(dls.cutter_port)}</dd>
    <dt>Step size</dt><dd>${dls.cutter_step_size_mm ? esc(dls.cutter_step_size_mm) + " mm" : "—"}</dd>
    <dt>Data link</dt><dd>${stat(dls.is_running, "RUNNING", "STOPPED")}</dd>
    <dt>Hot folder</dt><dd>${stat(ing.is_running, "WATCHING", "STOPPED")}</dd>
    <dt>Processed</dt><dd>${ing.processed_count ?? 0}</dd>
    <dt>Errors</dt><dd>${ing.error_count ?? 0}</dd>
    <dt>Last file</dt><dd>${esc(ing.last_processed_file || "—")}</dd>`;
}

function authHeaders() {
  const key = localStorage.getItem("ogs_api_key");
  return key ? {"X-API-Key": key} : {};
}

async function pollJobs() {
  let res;
  try {
    res = await fetch("/jobs?limit=15", {headers: authHeaders(), cache: "no-store"});
  } catch { return; }
  if (res.status === 401) {
    $("jobs-wrap").innerHTML =
      '<div class="jobs-empty">This server requires an API key to list jobs.</div>';
    $("keyrow").style.display = "flex";
    return;
  }
  $("keyrow").style.display = "none";
  const jobs = await res.json();
  if (!jobs.length) {
    $("jobs-wrap").innerHTML =
      '<div class="jobs-empty">No jobs loaded. Drop a PDF in the hot folder or POST to /jobs/import-pdf.</div>';
    return;
  }
  $("jobs-wrap").innerHTML = `<table>
    <thead><tr><th>ID</th><th>Barcode</th><th>Job</th><th>Size</th><th>Loaded</th><th></th></tr></thead>
    <tbody>${jobs.map((j) => `<tr>
      <td class="num">${j.id}</td>
      <td>${barcodeHTML(j.barcode_link_info)}</td>
      <td>${esc(j.name)}</td>
      <td class="num">${(j.command_length / 1024).toFixed(1)} KB</td>
      <td class="mono-cell">${new Date(j.created_at).toLocaleString([], {hour12: false})}</td>
      <td><button class="del" data-id="${j.id}" data-name="${esc(j.name)}">DELETE</button></td>
    </tr>`).join("")}</tbody></table>`;
}

document.addEventListener("click", async (evt) => {
  const btn = evt.target.closest(".del");
  if (!btn) return;
  if (!confirm(`Delete job "${btn.dataset.name}"? The cutter will no longer be offered it.`)) return;
  const res = await fetch(`/jobs/${btn.dataset.id}`, {
    method: "DELETE", headers: authHeaders(),
  });
  if (res.status === 401) $("keyrow").style.display = "flex";
  pollJobs();
});

$("key-save").addEventListener("click", () => {
  localStorage.setItem("ogs_api_key", $("key-input").value.trim());
  pollJobs();
});

fetch("/version").then((r) => r.json()).then((v) => {
  $("foot-id").textContent = `${v.name.toLowerCase()} · v${v.version}`;
}).catch(() => {});
$("foot-host").textContent = window.location.host;

pollHealth(); pollJobs();
setInterval(pollHealth, 2000);
setInterval(pollJobs, 5000);
</script>
</body>
</html>
